; SweetYaar Baby BT Speaker Controller
; Target: ESP32-WROOM-32 (original ESP32 only — required for BT Classic A2DP)
; Phase 2: Core firmware + Web BLE parent controls

[platformio]
default_envs = sweetyaar

[env:sweetyaar]
platform = espressif32@^6.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; min_spiffs gives ~1.9MB per OTA partition — enough for BT + audio stack
board_build.partitions = min_spiffs.csv

lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#812ed5e27b88c8ce0a5f97e15d37c6de2b7ad40b
    https://github.com/pschatzmann/arduino-audio-tools.git#1da31e372a651326f0bfe6949c2efba8ea35d213
    bblanchon/ArduinoJson @ 7.4.3
    makuna/NeoPixelBus @ 2.8.4

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Required for arduino-audio-tools to find SD source
    -DAUDIO_TOOLS_PREFER_SD
    ; Arduino-ESP32's bundled I2S library emits a deprecated ADC constant warning.
    -Wno-deprecated-declarations

; Generic prototype board: Q3 (MMBT3904) inverts GPIO21, so HIGH mutes.
; Its bench addressable-LED data path connects GPIO2 directly to DIN, without the
; production NPN level shifter, so it needs a normal (non-inverted) waveform.
; The currently used bench LED is the four-channel RGBW/SK6812-style variant.
[env:sweetyaar-generic]
extends = env:sweetyaar
build_flags =
    ${env:sweetyaar.build_flags}
    -DSWEETYAAR_AMP_MUTE_ACTIVE_HIGH=1
    -DSWEETYAAR_STATUS_LED_DATA_INVERTED=0
    -DSWEETYAAR_STATUS_LED_RGBW=1
    -DSWEETYAAR_STATUS_LED_COLOR_ORDER_GRB=1
