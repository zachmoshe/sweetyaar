[project]
name = "sweetyaar"
version = "0.1.0"
description = "ESP32-WROOM-32 baby toy audio controller firmware and local tooling."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "esp-coredump>=1.13,<2",
    "platformio==6.1.19",
    "pytest>=8,<9",
]
audio = [
    "numpy",
    "scipy",
]
cloud = [
    "google-cloud-firestore>=2.19,<3",
]

[tool.uv]
package = false
default-groups = ["dev", "audio", "cloud"]
